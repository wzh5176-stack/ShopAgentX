name: ShopAgent regression

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: regression-only-password
          MYSQL_DATABASE: shopagent_regression
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SHOPAGENT_TEST_MYSQL_ALLOW: empty-regression-db
      SHOPAGENT_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/shopagent_regression?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SHOPAGENT_TEST_MYSQL_USER: root
      SHOPAGENT_TEST_MYSQL_PASSWORD: regression-only-password
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-service/requirements-api.txt
            scripts/requirements.txt
      - name: Install lightweight API dependencies
        run: python -m pip install -r ai-service/requirements-api.txt -r scripts/requirements.txt
      - name: Run business, API, security, SQL and MySQL regression
        run: python scripts/regression.py --maven mvn --python python --mysql
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            tmp/regression/
          retention-days: 14
