name: shopagent-restore-lab

services:
  mysql-restore:
    image: mysql:8.4.11
    pull_policy: never
    restart: "no"
    mem_limit: 512m
    network_mode: none
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: shopagent
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=20
    volumes:
      - restore-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "--protocol=TCP", "--host=127.0.0.1", "--user=root", "--database=shopagent", "--execute=SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  restore-mysql-data: