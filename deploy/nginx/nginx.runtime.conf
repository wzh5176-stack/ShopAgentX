worker_processes 1;

events {
    worker_connections 1024;
}

http {
    log_format shopagent '$remote_addr [$time_local] "$request_method $uri" '
                         'status=$status upstream=$upstream_addr upstream_status=$upstream_status';
    access_log /var/log/nginx/access.log shopagent;
    error_log /var/log/nginx/error.log warn;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream shopagent_backend {
        zone shopagent_backend 64k;
        server backend-a:8888 resolve max_fails=1 fail_timeout=5s;
        server backend-b:8888 resolve max_fails=1 fail_timeout=5s;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        location / {
            proxy_pass http://shopagent_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
            proxy_buffering off;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
            add_header X-ShopAgent-Upstream $upstream_addr always;
        }
    }
}
